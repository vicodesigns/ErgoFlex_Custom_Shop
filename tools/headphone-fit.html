<!doctype html><title>ErgoFlex · Headphone socket review</title><style>body{margin:0;background:#101c28;color:#eef7ff;font:15px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{padding:9px;border:1px solid #59858e;border-radius:6px;background:#183541;color:inherit}iframe{border:0;width:100%;height:78vh}pre{white-space:pre-wrap;padding:16px}#stills{display:flex}img{width:33.3%}</style>
<header><b>Plug-mounted headphone hook</b><select id="room"><option>occmedialab</option><option>gaming</option><option>music</option><option>home</option><option>library</option><option>highschool</option><option>office</option><option>product</option></select><select id="size"><option>48x30</option><option>60x30</option></select><button id="load">Inspect socket</button><button id="side">Other side</button><button id="tilt">Tilt desk · 45°</button><button id="test">Check environments & sizes</button><span id="status">Loading…</span></header><iframe id="stage" title="Socket fit preview" allow="autoplay"></iframe><pre id="report"></pre>
<script type="module">
const $=id=>document.getElementById(id);$('stage').src='/?room=occmedialab&view=room&layout=spacious&presentation=1&tour=1';
const wait=()=>new Promise(r=>setTimeout(r,100));while(!$('stage').contentWindow.ErgoPresentation)await wait();
const script=$('stage').contentDocument.createElement('script');script.type='module';script.src='/tools/headphone-fit-session.mjs';$('stage').contentDocument.body.append(script);while(!$('stage').contentWindow.HeadphoneFit)await wait();const fit=$('stage').contentWindow.HeadphoneFit;
let busy=false;async function run(fn){if(busy)return;busy=true;try{await fn();}catch(e){$('status').textContent=e.message;console.error(e);}finally{busy=false;}}
async function load(){const room=$('room').value,size=$('size').value;$('status').textContent='Loading '+room+' '+size;await fit.load(room,size);$('report').textContent=JSON.stringify(fit.report(),null,2);$('status').textContent='Socket ready';}
$('load').onclick=()=>run(load);$('side').onclick=()=>fit.frame(-1);$('tilt').onclick=async()=>{await fit.tilt();$('report').textContent=JSON.stringify(fit.report(),null,2);};
$('test').onclick=()=>run(async()=>{const results=[];for(const room of ['occmedialab','gaming','music','home','library','highschool','office'])for(const size of ['48x30','60x30']){ $('room').value=room;$('size').value=size;await load();const report=fit.report();if(!report.headphones.length)throw Error('No headphones found in '+room);if(report.headphones.some(h=>h.role!=='shelf'||h.revision!=='original-v2'||!h.hookObjects.length))throw Error('Socket binding failed in '+room);results.push({room,size,...report});$('report').textContent=JSON.stringify(results,null,2);}window.fitResults=results;$('status').textContent='14 environment / size checks complete';});await run(load);
</script>
