<!doctype html><title>Environment specialist review</title><style>body{margin:0;background:#102028;color:#edf6ef;font:14px system-ui}header{padding:12px;display:flex;align-items:center;gap:12px}button,select,a{background:#25434c;color:inherit;padding:8px;border:1px solid #5c878d;border-radius:6px}iframe{width:100%;height:64vh;border:0}#stills{display:grid;grid-template-columns:repeat(3,1fr)}figure{margin:8px}img{width:100%}pre{white-space:pre-wrap;max-height:200px;overflow:auto}</style>
<header><b>Environment specialist review</b><select id="room"></select><select id="phase"><option>afternoon</option><option>evening</option><option>night</option><option>party</option><option>morning</option></select><button id="load">Inspect environment</button><button id="roomview">Whole room</button><button id="tilt">Lift & tilt check</button><button id="all">Review environments</button><button id="child">Child sizes & activities</button><a id="download">Save report</a><span id="status">Loading…</span></header><iframe id="stage" title="Environment preview" allow="autoplay"></iframe><pre id="report"></pre><section id="stills"></section>
<script type="module">
const $=id=>document.getElementById(id),rooms=['childroom','home','bedroom','lounge','kitchen','gym','creative','gaming','music','gallery','workshop','library','occmedialab','highschool','kindergarten','elementary','middleschool','college','university','hospital','laboratory','mobileit','government','police','security','office','coworking','study','scifi'];
$('room').innerHTML=rooms.map(id=>`<option>${id}</option>`).join('');$('stage').src='/?room=home&view=room&layout=house&presentation=1&tour=1';
const wait=()=>new Promise(r=>setTimeout(r,100));while(!$('stage').contentWindow.ErgoPresentation)await wait();const script=$('stage').contentDocument.createElement('script');script.type='module';script.src='/tools/environment-review-session.mjs';$('stage').contentDocument.body.append(script);while(!$('stage').contentWindow.EnvironmentReview)await wait();const review=$('stage').contentWindow.EnvironmentReview;let busy=false,results=[];
const save=()=>{$('download').href=URL.createObjectURL(new Blob([JSON.stringify(results,null,2)],{type:'application/json'}));$('download').download='environment-browser-review.json';$('report').textContent=JSON.stringify(results,null,2);};
async function run(fn){if(busy)return;busy=true;try{await fn();}catch(e){$('status').textContent=e.stack;console.error(e);}finally{busy=false;}}
async function load(){const room=$('room').value,phase=$('phase').value;$('status').textContent='Loading '+room+' · '+phase;const report=await review.load(room,phase);if(room==='childroom')review.frameRoom();$('report').textContent=JSON.stringify(report,null,2);$('status').textContent='Ready · '+room+' · '+phase;return report;}
$('load').onclick=()=>run(load);$('roomview').onclick=()=>review.frameRoom();$('tilt').onclick=()=>run(async()=>{await review.tilt();$('status').textContent='52.5 inch lift · 45° tilt';});
$('all').onclick=()=>run(async()=>{results=[];$('stills').replaceChildren();for(let i=0;i<rooms.length;i++){const room=rooms[i],phase=['afternoon','evening','night','party','morning'][i%5];$('room').value=room;$('phase').value=phase;const report=await load();results.push(report);const figure=document.createElement('figure'),img=new Image();img.src=review.capture();figure.append(img,document.createTextNode(room+' · '+phase));$('stills').append(figure);save();$('status').textContent=`Reviewed ${i+1}/${rooms.length}`;} $('status').textContent='29 environments reviewed';});
$('child').onclick=()=>run(async()=>{results=[];$('stills').replaceChildren();for(const layout of ['apartment','house','spacious','premium','executive'])for(const phase of ['morning','afternoon','evening','night','party']){$('status').textContent='Child room · '+layout+' · '+phase;const report=await review.load('childroom',phase,'48x30',layout);review.frameRoom();results.push(report);if(layout==='house'||phase==='afternoon'){const f=document.createElement('figure'),img=new Image();img.src=review.capture();f.append(img,document.createTextNode(layout+' · '+phase));$('stills').append(f);}save();}$('status').textContent='25 child room size / activity checks complete';});await run(load);
</script>
