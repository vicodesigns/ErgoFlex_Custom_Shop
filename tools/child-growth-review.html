<!doctype html><title>Growing room · specialist review</title><style>body{margin:0;background:#102028;color:#edf6ef;font:14px system-ui}header{padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}button,select,a{background:#25434c;color:inherit;padding:8px;border:1px solid #5c878d;border-radius:6px}iframe{width:100%;height:65vh;border:0}#stills{display:grid;grid-template-columns:repeat(3,1fr)}figure{margin:8px}img{width:100%}pre{white-space:pre-wrap;max-height:170px;overflow:auto}</style>
<header><b>Growing room</b><label>Life stage <select id="age"></select></label><label>Room <select id="layout"><option>apartment</option><option selected>house</option><option>spacious</option><option>premium</option><option>executive</option></select></label><label>Activity <select id="phase"><option>morning</option><option selected>afternoon</option><option>evening</option><option>night</option><option>party</option></select></label><button id="load">Inspect stage</button><button id="test">Check growth stages</button><button id="testearly">Check early years</button><a id="download">Save review</a><span id="status">Loading…</span></header><iframe id="stage" title="Growing room preview" allow="autoplay"></iframe><pre id="report"></pre><section id="stills"></section>
<script type="module">
import {CHILD_AGE_STAGES} from '../child-growth-profiles.mjs';
const $=id=>document.getElementById(id);$('age').innerHTML=Object.values(CHILD_AGE_STAGES).map(s=>`<option value="${s.id}">${s.label}</option>`).join('');$('stage').src='/?room=childroom&view=room&layout=house&presentation=1&tour=1';
const wait=()=>new Promise(r=>setTimeout(r,100));while(!$('stage').contentWindow.ErgoPresentation)await wait();const script=$('stage').contentDocument.createElement('script');script.type='module';script.src='/tools/environment-review-session.mjs?v=growing-room';$('stage').contentDocument.body.append(script);while(!$('stage').contentWindow.EnvironmentReview)await wait();const review=$('stage').contentWindow.EnvironmentReview;let busy=false,results=[];
async function run(fn){if(busy)return;busy=true;try{await fn();}catch(e){$('status').textContent=e.stack;console.error(e);}finally{busy=false;}}
async function load(age=$('age').value,layout=$('layout').value,phase=$('phase').value){const id=layout+(age==='early'?'':age),size=CHILD_AGE_STAGES[age].deskSize;$('status').textContent=CHILD_AGE_STAGES[age].short+' · '+layout+' · '+phase;const report=await review.load('childroom',phase,size,id);review.frameRoom();$('report').textContent=JSON.stringify(report,null,2);return report;}
function save(){if($('download').href.startsWith('blob:'))URL.revokeObjectURL($('download').href);$('download').href=URL.createObjectURL(new Blob([JSON.stringify(results,null,2)],{type:'application/json'}));$('download').download='child-growth-browser-review.json';$('report').textContent=JSON.stringify(results,null,2);}
function still(age,layout,phase){const f=document.createElement('figure'),img=new Image();img.src=review.capture();f.append(img,document.createTextNode(age+' · '+layout+' · '+phase));$('stills').append(f);}
$('load').onclick=()=>run(async()=>{await load();$('status').textContent='Stage ready';});
$('testearly').onclick=()=>run(async()=>{results=[];$('stills').replaceChildren();for(const layout of ['apartment','house','spacious','premium','executive'])for(const phase of ['morning','afternoon','evening','night','party']){const report=await load('early',layout,phase);results.push(report);still('early',layout,phase);save();}$('status').textContent='25 early-years room / activity checks complete';});
$('test').onclick=()=>run(async()=>{results=[];$('stills').replaceChildren();const phases=['morning','afternoon','evening','night','party'],layouts=['apartment','house','spacious','premium','executive'];for(const age of Object.keys(CHILD_AGE_STAGES)){for(let i=0;i<layouts.length;i++){const layout=layouts[i],phase=phases[i];const report=await load(age,layout,phase);results.push(report);if(layout==='house')still(age,layout,phase);save();}for(const phase of phases.filter(p=>p!=='afternoon')){const report=await load(age,'house',phase);results.push(report);if(['evening','night','party'].includes(phase))still(age,'house',phase);save();}}$('status').textContent='45 growth-stage / room / activity checks complete';});await run(async()=>{await load();$('status').textContent='Stage ready';});
</script>
