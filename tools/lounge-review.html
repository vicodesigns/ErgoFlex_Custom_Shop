<!doctype html><title>Lounge design review</title><style>body{margin:0;background:#162027;color:#eae5dc;font:14px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,a{padding:8px;color:inherit;background:#31434b;border:1px solid #75868a;border-radius:6px}iframe{width:min(100%,900px);height:auto;aspect-ratio:16/9;border:0}iframe.capture-fill{position:fixed;inset:0;width:100vw;height:100vh;aspect-ratio:auto;z-index:99999}#stills{display:grid;grid-template-columns:repeat(3,1fr)}figure{margin:8px}img{width:100%}pre{white-space:pre-wrap;max-height:200px;overflow:auto}</style>
<header><b>Lounge design review</b><select id="style"><option value="contemporary">Ultra-contemporary</option><option value="earthy">Earthy &amp; textured</option></select><select id="layout"><option>apartment</option><option>house</option><option selected>spacious</option><option>premium</option><option>executive</option></select><select id="phase"><option>morning</option><option selected>afternoon</option><option>evening</option><option>night</option><option>party</option></select><select id="size"><option>48x30</option><option>60x30</option></select><button id="load">Inspect lounge</button><button id="window">Window wall view</button><button id="media">Media wall view</button><button id="seating">Seating group view</button><button id="capture">Capture this view</button><button id="all">Review all 100 states</button><button id="design">Review dressed interiors</button><button id="compositions">Review compositions</button><span id="status">Loading…</span></header><iframe id="stage" title="Lounge preview" allow="autoplay"></iframe><pre id="report"></pre><section id="stills"></section>
<script type="module">
const $=id=>document.getElementById(id);$('stage').src='/?room=lounge&view=room&layout=spacious&style=contemporary&presentation=1&tour=1&ceiling=on';const wait=()=>new Promise(r=>setTimeout(r,100));while(!$('stage').contentWindow.ErgoPresentation)await wait();const script=$('stage').contentDocument.createElement('script');script.type='module';script.src='/tools/environment-review-session.mjs?v=lounge-reset';$('stage').contentDocument.body.append(script);while(!$('stage').contentWindow.EnvironmentReview)await wait();const review=$('stage').contentWindow.EnvironmentReview;let busy=false,results=[];
async function run(fn){if(busy)return;busy=true;try{await fn();}catch(e){$('status').textContent=e.stack;}finally{busy=false;}}
async function load(layout=$('layout').value,phase=$('phase').value,size=$('size').value,style=$('style').value){$('status').textContent=style+' · '+layout+' · '+phase+' · '+size;const r=await review.load('lounge',phase,size,layout+(style==='contemporary'?'contemporary':''));review.frameRoom();await review.settleView();$('report').textContent=JSON.stringify(r,null,2);return r;}
async function captureView(width=1600,height=900){await review.settleView();return review.capture(width,height);}
$('seating').onclick=()=>review.frameConversation();
$('media').onclick=()=>review.frameMedia();$('capture').onclick=async()=>{await review.settleView();const f=document.createElement('figure'),img=new Image();img.src=await captureView();f.append(img,document.createTextNode($('style').value+' · '+$('layout').value+' · '+$('phase').value));$('stills').append(f);};$('window').onclick=()=>review.frameWindow();$('load').onclick=()=>run(async()=>{await load();$('status').textContent='Lounge ready';});$('all').onclick=()=>run(async()=>{results=[];$('stills').replaceChildren();for(const style of ['contemporary','earthy'])for(const layout of ['apartment','house','spacious','premium','executive'])for(const size of ['48x30','60x30'])for(const phase of ['morning','afternoon','evening','night','party']){results.push(await load(layout,phase,size,style));const f=document.createElement('figure'),img=new Image();img.src=await captureView(640,360);f.append(img,document.createTextNode(style+' · '+layout+' · '+phase+' · '+size));$('stills').append(f);$('report').textContent=JSON.stringify(results,null,2);}$('status').textContent='100 lounge style / layout / activity / desk-size checks complete';});$('design').onclick=()=>run(async()=>{results=[];$('stills').replaceChildren();for(const [layout,phase,view] of [['premium','evening','window'],['premium','evening','media'],['premium','party','room'],['apartment','evening','window'],['executive','party','room'],['house','morning','window'],['spacious','night','media']]){results.push(await load(layout,phase,'60x30','contemporary'));if(view==='window')review.frameWindow();if(view==='media')review.frameMedia();await review.settleView();const f=document.createElement('figure'),img=new Image();img.src=await captureView();f.append(img,document.createTextNode('contemporary · '+layout+' · '+phase+' · '+view));$('stills').append(f);$('report').textContent=JSON.stringify(results,null,2);}$('status').textContent='7 dressed-interior reviews complete';});$('compositions').onclick=()=>run(async()=>{results=[];$('stills').replaceChildren();for(const style of ['contemporary','earthy'])for(const [layout,phase] of [['apartment','afternoon'],['apartment','evening'],['premium','afternoon'],['premium','evening'],['executive','afternoon']]){results.push(await load(layout,phase,'60x30',style));const f=document.createElement('figure'),img=new Image();img.src=await captureView(640,360);f.append(img,document.createTextNode(style+' · '+layout+' · '+phase));$('stills').append(f);$('report').textContent=JSON.stringify(results,null,2);}$('status').textContent='10 composition reviews complete';});await run(async()=>{await load();$('status').textContent='Lounge ready';});
</script>
