<!-- ErgoFlex E-Stop Icon (SVG) - Flutter friendly -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Emergency Stop Button</title>
  <desc id="desc">A large red emergency stop button overlapping a yellow safety bezel, labeled STOP.</desc>

  <defs>
    <radialGradient id="gRed" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F36C6C"/>
      <stop offset="55%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#A32020"/>
    </radialGradient>

    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD400"/>
      <stop offset="100%" stop-color="#C7A100"/>
    </linearGradient>

    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Yellow bezel -->
  <g>
    <circle cx="64" cy="64" r="56" fill="url(#gYellow)" stroke="#111111" stroke-width="3"/>
    <circle cx="64" cy="64" r="40" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="0.5"/>
  </g>

  <!-- BIGGER red button overlaps bezel (r=46) -->
  <g>
    <circle cx="64" cy="64" r="46" fill="url(#gRed)" stroke="#111111" stroke-width="2"/>
    <ellipse cx="64" cy="52" rx="34" ry="16" fill="url(#gGloss)"/>
    <circle cx="64" cy="64" r="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <!-- STOP label (outlined for readability) -->
  <g aria-hidden="true">
    <text x="64" y="72"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="26" font-weight="900" text-anchor="middle"
          letter-spacing="2"
          stroke="#111111" stroke-width="3" stroke-linejoin="round" fill="none">
      STOP
    </text>
    <text x="64" y="72"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="26" font-weight="900" text-anchor="middle"
          letter-spacing="2"
          fill="#FFFFFF">
      STOP
    </text>
  </g>
</svg>
